name: Publish to npm

# Started by hand (Actions > Publish to npm > Run workflow) until the package
# is on npm: npm trusted publishing (OIDC, no token) can only be set up for a
# package that already exists, so the first version is published by hand
# (cd plugin && npm publish --access public). Then add this workflow as the
# package's trusted publisher on npmjs.com and, if wanted, run it on push to
# main like ocearo-ui.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Tests
        working-directory: plugin
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm test

      # prepack copies the READMEs, the CHANGELOG and the LICENSE into plugin/
      - name: Publish to npm
        working-directory: plugin
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "ocearo-core@${VERSION}" version 2>/dev/null || true)
          if [ "${PUBLISHED}" = "${VERSION}" ]; then
            echo "ocearo-core@${VERSION} is already on npm, skipping publish"
          else
            npm publish --access public --provenance
          fi

      # The App Store's Changelog tab reads the GitHub releases: one per version,
      # with its CHANGELOG.md section
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./plugin/package.json').version")
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists"
          else
            node scripts/release-notes.mjs "${VERSION}" > release-notes.md
            gh release create "${VERSION}" --target "${GITHUB_SHA}" --title "Ocearo Core ${VERSION}" --notes-file release-notes.md
          fi
